<!DOCTYPE html>
<html>
<head>
    <title>My Complaints</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Complaints</h1>

    <div id="complaintsContainer">
        <p>Loading complaints...</p>
    </div>

    <br>

    <button onclick="window.location.href='complaint.html'">
        Submit New Complaint
    </button>

    <button onclick="window.location.href='student-dashboard.html'">
        Back to Dashboard
    </button>

    <button id="logoutBtn">
        Logout
    </button>


    <script type="module">

        import { auth, db } from "./firebase-config.js";

        import {
            collection,
            getDocs,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


        const container =
            document.getElementById("complaintsContainer");


        onAuthStateChanged(auth, async function(user) {

            if (!user) {

                window.location.href = "student-login.html";

                return;
            }


            try {

                const q = query(
                    collection(db, "complaints"),
                    where("studentId", "==", user.uid)
                );


                const querySnapshot = await getDocs(q);


                if (querySnapshot.empty) {

                    container.innerHTML =
                        "<p>No complaints submitted yet.</p>";

                    return;
                }


                container.innerHTML = "";


                querySnapshot.forEach(function(doc) {

                    const complaint = doc.data();

                    let dateText = "Date not available";


                    if (complaint.createdAt) {

                        dateText =
                            complaint.createdAt
                            .toDate()
                            .toLocaleString();

                    }


                    const div =
                        document.createElement("div");


                    div.style.background = "white";
                    div.style.maxWidth = "600px";
                    div.style.margin = "20px auto";
                    div.style.padding = "20px";
                    div.style.borderRadius = "10px";
                    div.style.boxShadow =
                        "0 3px 12px rgba(0,0,0,0.12)";
                    div.style.textAlign = "left";


                    div.innerHTML = `

                        <h2>${complaint.title}</h2>

                        <p>
                            <strong>Category:</strong>
                            ${complaint.category}
                        </p>

                        <p>
                            <strong>Description:</strong>
                            ${complaint.description}
                        </p>

                        <p>
                            <strong>Status:</strong>
                            ${complaint.status}
                        </p>

                        <p>
                            <strong>Date & Time:</strong>
                            ${dateText}
                        </p>

                    `;


                    container.appendChild(div);

                });


            } catch (error) {

                container.innerHTML =
                    "<p>Unable to load complaints.</p>";

                alert(
                    "Error loading complaints: "
                    + error.message
                );

            }

        });


        document
            .getElementById("logoutBtn")
            .addEventListener("click", async function() {

                await signOut(auth);

                alert("Logged out successfully!");

                window.location.href =
                    "student-login.html";

            });

    </script>

</body>
</html>
